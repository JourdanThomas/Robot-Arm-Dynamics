<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="flo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
  </defs>

  <!-- fond -->
  <rect x="0" y="0" width="640" height="390" rx="14" fill="#ffffff"/>

  <!-- bati et hachures -->
  <rect x="180" y="52" width="80" height="10" fill="#d0d4da" stroke="#555" stroke-width="1"/>
  <g stroke="#555" stroke-width="1.2">
    <line x1="184" y1="52" x2="192" y2="42"/><line x1="194" y1="52" x2="202" y2="42"/>
    <line x1="204" y1="52" x2="212" y2="42"/><line x1="214" y1="52" x2="222" y2="42"/>
    <line x1="224" y1="52" x2="232" y2="42"/><line x1="234" y1="52" x2="242" y2="42"/>
    <line x1="244" y1="52" x2="252" y2="42"/><line x1="254" y1="52" x2="262" y2="42"/>
  </g>
  <line x1="220" y1="62" x2="220" y2="70" stroke="#555" stroke-width="2"/>

  <!-- verticale de reference et prolongement du segment 1 -->
  <line x1="220" y1="70" x2="220" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="315" y1="234.5" x2="352.5" y2="299.45" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- segments -->
  <line x1="220" y1="70" x2="315" y2="234.5" stroke="#4a6fa5" stroke-width="12" stroke-linecap="round"/>
  <line x1="315" y1="234.5" x2="502.1" y2="267.5" stroke="#4a6fa5" stroke-width="12" stroke-linecap="round"/>

  <!-- angles -->
  <path d="M 220 120 A 50 50 0 0 0 245 113.3" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="228" y="140" font-size="19" font-style="italic" fill="#222">θ₁</text>
  <path d="M 341 279.53 A 52 52 0 0 0 366.21 243.53" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="368" y="282" font-size="19" font-style="italic" fill="#222">θ₂</text>

  <!-- couples moteurs (etape 5) -->
  <path d="M 209.74 98.19 A 30 30 0 0 1 190.46 75.21" fill="none" stroke="#d9822b" stroke-width="2.2" marker-end="url(#flo)"/>
  <text x="160" y="108" font-size="18" font-style="italic" fill="#d9822b">τ₁</text>
  <path d="M 319.86 206.93 A 28 28 0 0 1 341.31 224.92" fill="none" stroke="#d9822b" stroke-width="2.2" marker-end="url(#flo)"/>
  <text x="340" y="203" font-size="18" font-style="italic" fill="#d9822b">τ₂</text>

  <!-- articulations et effecteur -->
  <circle cx="220" cy="70" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="315" cy="234.5" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="502.1" cy="267.5" r="4" fill="#222"/>

  <!-- centres de gravite -->
  <g stroke="#222" stroke-width="1.5">
    <circle cx="267.5" cy="152.3" r="6.5" fill="#fff"/>
    <path d="M 267.5 152.3 L 274 152.3 A 6.5 6.5 0 0 1 267.5 158.8 Z" fill="#222"/>
    <path d="M 267.5 152.3 L 261 152.3 A 6.5 6.5 0 0 1 267.5 145.8 Z" fill="#222"/>
    <circle cx="408.6" cy="251" r="6.5" fill="#fff"/>
    <path d="M 408.6 251 L 415.1 251 A 6.5 6.5 0 0 1 408.6 257.5 Z" fill="#222"/>
    <path d="M 408.6 251 L 402.1 251 A 6.5 6.5 0 0 1 408.6 244.5 Z" fill="#222"/>
  </g>

  <!-- etiquettes -->
  <text x="236" y="80" font-size="16" fill="#222">O</text>
  <text x="290" y="256" font-size="16" fill="#222">A</text>
  <text x="280" y="143" font-size="16" fill="#222">G₁</text>
  <text x="396" y="236" font-size="16" fill="#222">G₂</text>
  <text x="305" y="182" font-size="17" font-style="italic" fill="#4a6fa5">l</text>
  <text x="452" y="244" font-size="17" font-style="italic" fill="#4a6fa5">l</text>
  <text x="512" y="290" font-size="14" fill="#555">effecteur</text>

  <!-- repere -->
  <line x1="60" y1="150" x2="108" y2="150" stroke="#222" stroke-width="1.8" marker-end="url(#fl)"/>
  <line x1="60" y1="150" x2="60" y2="102" stroke="#222" stroke-width="1.8" marker-end="url(#fl)"/>
  <text x="113" y="155" font-size="16" font-style="italic" fill="#222">x</text>
  <text x="54" y="95" font-size="16" font-style="italic" fill="#222">y</text>

  <!-- gravite -->
  <line x1="585" y1="70" x2="585" y2="140" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <text x="595" y="112" font-size="18" font-style="italic" fill="#222">g</text>

  <!-- legende -->
  <text x="24" y="338" font-size="13.5" fill="#333">θ₁ : angle du segment 1 par rapport à la verticale · θ₂ : angle du segment 2 par rapport au segment 1</text>
  <text x="24" y="360" font-size="13.5" fill="#333">G₁, G₂ : centres de gravité (masses ponctuelles à l'étape 3, tiges homogènes aux étapes 4 et 5)</text>
  <text x="24" y="382" font-size="13.5" fill="#d9822b">τ₁, τ₂ : couples moteurs, uniquement pour le bras commandé (étape 5)</text>
</svg>
